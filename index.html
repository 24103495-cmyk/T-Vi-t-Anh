<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài tập về nhà 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- YÊU CẦU 2: neo (anchor) đặt trước, trỏ đến id trên thẻ main -->
  <a class="skip-link" href="#main-content">Chuyển đến Nội dung chính</a>

  <header>
    <h1>Bài tập về nhà 2</h1>

    <!-- YÊU CẦU 4 & 5: nav (inline-block, 80%) chứa ảnh (10%) -->
    <nav>
      <ul>
        <li><a href="#main-content">Trang chủ</a>
          <img src="icon-home.png" alt="Biểu tượng trang chủ"></li>
        <li><a href="#main-content">Dự án</a>
          <img src="icon-project.png" alt="Biểu tượng dự án"></li>
        <li><a href="#main-content">Liên hệ</a>
          <img src="icon-contact.png" alt="Biểu tượng liên hệ"></li>
      </ul>
    </nav>
  </header>

  <!-- YÊU CẦU 2: id="main-content" là đích đến của skip link -->
  <main id="main-content">

    <section>
      <h2>Bố cục lưới (Grid)</h2>
      <!-- YÊU CẦU 6, 7, 8: .grid 2 cột ~40%, ảnh rộng 100% -->
      <div class="grid">
        <div>
          <img src="anh1.jpg" alt="Mô tả ảnh 1">
          <p>Mục lưới 1</p>
        </div>
        <div>
          <img src="anh2.jpg" alt="Mô tả ảnh 2">
          <p>Mục lưới 2</p>
        </div>
        <div>
          <img src="anh3.jpg" alt="Mô tả ảnh 3">
          <p>Mục lưới 3</p>
        </div>
        <div>
          <img src="anh4.jpg" alt="Mô tả ảnh 4">
          <p>Mục lưới 4</p>
        </div>
      </div>
    </section>

    <section>
      <h2>Bố cục linh hoạt (Flexbox)</h2>
      <!-- YÊU CẦU 9: .flex với flex-wrap và justify-content -->
      <div class="flex">
        <div>
          <img src="anh5.jpg" alt="Mô tả ảnh 5">
          <p>Mục flex 1</p>
        </div>
        <div>
          <img src="anh6.jpg" alt="Mô tả ảnh 6">
          <p>Mục flex 2</p>
        </div>
        <div>
          <img src="anh7.jpg" alt="Mô tả ảnh 7">
          <p>Mục flex 3</p>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Bài tập về nhà 2</p>
  </footer>

</body>
</html>
